name: snap-vn

on:
  schedule:
    - cron: "20 9 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "50 9 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "20 10 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "50 10 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "20 11 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "40 11 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "20 13 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "50 13 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "20 14 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "50 14 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "5 15 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snap-vn
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ vars.BOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          missing=""
          for name in "SUPABASE_URL" "SUPABASE_SECRET_KEY"; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing secrets:$missing"
            exit 1
          fi
      - name: Run VN snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 -m pipeline.run --market VN
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Write bulletin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -m pipeline.bulletin --market VN
      - name: Send notifications
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m pipeline.notify --market VN
      - name: Alert on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALERT_MARKET: VN
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m pipeline.alert
