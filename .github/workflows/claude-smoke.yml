name: claude-smoke

# Manual check that CLAUDE_CODE_OAUTH_TOKEN works through the same code path the bulletin uses (pipeline.agent._call_cli).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Ask for a one-line bulletin
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pipeline import agent
          table = agent.build_table([{"symbol": "HPG", "level": 2, "signals": [{"id": "S1", "dir": None}]}], "09:50")
          print(agent._call_cli(table, [], agent.MODEL, os.environ["CLAUDE_CODE_OAUTH_TOKEN"]))
          PY
