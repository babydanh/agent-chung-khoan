<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */
</style>
<style>
/* ===== Handset shell (presentation only) ===== */
[hidden]:not([hidden="until-found" i]) { display: none !important; }
:root {
  --phone-screen-width: 390px;
  --phone-screen-height: 844px;
  --phone-bezel: 10px;
  --phone-outer-radius: 52px;
  --phone-screen-radius: 42px;
  --phone-safe-top: 50px;
  --phone-safe-bottom: 29px;
  --phone-system-fg: #17181a;
  --phone-screen-bg: #f8f8f9;
  --phone-stage-bg: #eaebee;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 32px;
  background: var(--phone-stage-bg, #eaebee);
  color: #191a1d;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
.phone-frame {
  position: relative;
  width: calc(var(--phone-screen-width, 390px) + var(--phone-bezel, 10px) * 2);
  height: calc(var(--phone-screen-height, 844px) + var(--phone-bezel, 10px) * 2);
  padding: var(--phone-bezel, 10px);
  border-radius: var(--phone-outer-radius, 52px);
  background:
    linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%),
    linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.13),
    inset 0 0 0 2px rgba(0,0,0,.85),
    0 32px 68px -20px rgba(10,12,16,.52),
    0 10px 24px -10px rgba(10,12,16,.32);
  isolation: isolate;
  flex: none;
}
.phone-frame::before, .phone-frame::after {
  content: ""; position: absolute; z-index: -1; top: 96px; bottom: 96px; width: 2px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
}
.phone-frame::before { left: 0; }
.phone-frame::after { right: 0; }
.hardware-button { position: absolute; width: 4px; border-radius: 3px; background: linear-gradient(90deg, #08090b, #2a2d33 60%, #08090b); box-shadow: inset 0 1px rgba(255,255,255,.08); }
.hardware-button.volume { left: -3px; top: 222px; height: 86px; }
.hardware-button.power { right: -3px; top: 270px; height: 82px; }
.phone-screen {
  position: relative; width: var(--phone-screen-width, 390px); height: var(--phone-screen-height, 844px);
  overflow: hidden; border-radius: var(--phone-screen-radius, 42px); background: var(--phone-screen-bg, #f8f8f9);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
}
.phone-content {
  position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding-top: var(--phone-safe-top, 50px); padding-bottom: var(--phone-safe-bottom, 29px);
  background: var(--phone-screen-bg, #f8f8f9);
}
.phone-content::-webkit-scrollbar { display: none; }
.camera-dot {
  position: absolute; z-index: 40; top: 13px; left: 50%; width: 10px; height: 10px; transform: translateX(-50%);
  border-radius: 50%; background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06); pointer-events: none;
}
.status-bar {
  position: absolute; z-index: 40; inset: 0 0 auto; height: var(--phone-safe-top, 50px);
  display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); align-items: start;
  padding: 14px 20px 0; color: var(--phone-system-fg, #17181a); opacity: .8; pointer-events: none;
}
.status-time { justify-self: start; display: flex; align-items: center; height: 15px; font-size: 14px; font-weight: 560; line-height: 1; letter-spacing: .01em; }
.status-cutout-zone { width: 56px; }
.status-icons { justify-self: end; display: inline-flex; align-items: center; height: 15px; gap: 6px; }
.status-icons svg { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.status-icons .connectivity { width: 15px; height: 12px; }
.status-icons .wifi { width: 15px; height: 12px; }
.status-icons .battery { width: 19px; height: 11px; }
.gesture-indicator {
  position: absolute; z-index: 40; left: 50%; bottom: 8px; width: 96px; height: 4px; transform: translateX(-50%);
  border-radius: 99px; background: var(--phone-system-fg, #17181a); opacity: .86; pointer-events: none;
}
@media (max-height: 927px) { .phone-frame { zoom: 0.9; } }
@media (max-height: 840px) { .phone-frame { zoom: 0.82; } }
@media (max-height: 771px) { .phone-frame { zoom: 0.74; } }
@media (max-height: 702px) { .phone-frame { zoom: 0.66; } }
@media (max-width: 480px) {
  .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
  .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
  .phone-screen { width: 100%; height: 100%; border-radius: 0; }
}
</style>
<style>
/* ===== Product tokens ===== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --r-s: 8px; --r-m: 12px; --r-pill: 999px;
  --t-xs: 12px; --t-s: 14px; --t-m: 16px; --t-l: 20px; --t-xl: 28px;
  --dur: 200ms; --ease: cubic-bezier(.2, .7, .2, 1);
  --touch: 44px;
}
html[data-theme="dark"] {
  --stage: #0a0c0e;
  --bg: #0f1214; --surface: #171b1f; --surface2: #1f252a; --line: #262d33;
  --text: #e9edf0; --text2: #a0aab3; --text3: #7f8a94;
  --accent: #2dd4bf; --on-accent: #052420; --accent-soft: rgba(45, 212, 191, .22);
  --l0: #7f8a94; --l1: #4c9aff; --l2: #f5b301; --l3: #ff6a3d;
  --up: #2fd36b; --dn: #ff5c5c; --rf: #f0c020; --ce: #b980ff; --fl: #22c7e6;
  --danger: #ff5c5c; --phone-system-fg: #e9edf0; --phone-screen-bg: #0f1214;
}
html[data-theme="light"] {
  --stage: #e6e9ed;
  --bg: #f3f5f7; --surface: #ffffff; --surface2: #eaeef1; --line: #dce1e6;
  --text: #14181c; --text2: #46515c; --text3: #62707c;
  --accent: #0b7f74; --on-accent: #ffffff; --accent-soft: rgba(11, 127, 116, .2);
  --l0: #62707c; --l1: #2563eb; --l2: #b45f06; --l3: #d6411a;
  --up: #15803d; --dn: #d92d2d; --rf: #a16207; --ce: #7e22ce; --fl: #0e7490;
  --danger: #d92d2d; --phone-system-fg: #14181c; --phone-screen-bg: #f3f5f7;
}
body { background: var(--stage); display: flex; gap: 32px; justify-content: center; align-items: flex-start; color: var(--text); font-family: var(--font); }
@media (max-width: 1099px) { body { flex-direction: column; align-items: center; } }
@media (max-width: 480px) { body { display: block; padding: 0; } }
.phone-content { overflow: hidden; background: var(--bg); }
.phone-screen { background: var(--bg); }

/* ===== App skeleton ===== */
#app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); color: var(--text); font: 400 var(--t-s)/1.4 var(--font); font-variant-numeric: tabular-nums; }
:where(#app) :is(button, input) { font: inherit; color: inherit; }
:where(#app) button { cursor: pointer; background: none; border: 0; padding: 0; }
#app :focus-visible, .ds :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
#banner { grid-row: 1; }
#views { grid-row: 2; position: relative; min-height: 0; }
#tabbar { grid-row: 3; }
.view { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--bg); }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.t2 { color: var(--text2); } .t3 { color: var(--text3); }
.up { color: var(--up); } .dn { color: var(--dn); } .rf { color: var(--rf); } .ce { color: var(--ce); } .fl { color: var(--fl); }
.i-btn { width: var(--touch); height: var(--touch); display: grid; place-items: center; border-radius: var(--r-s); color: var(--text); }
.i-btn.on { color: var(--rf); }

/* banner */
.banner { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; min-height: 44px; background: var(--surface2); border-bottom: 1px solid var(--line); color: var(--text); }
.banner .od-fill { font-weight: 600; }
.btn-s { min-height: 36px; padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--line) !important; background: var(--surface); font-weight: 600; position: relative; }
.btn-s::before { content: ""; position: absolute; inset: -4px 0; }

/* header bars */
.bar { padding: 4px 0 8px; display: grid; gap: 4px; background: var(--bg); }
.bar-top { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; min-height: 48px; }
.bar-title { font-size: var(--t-l); font-weight: 700; }
.seg { display: inline-flex; background: var(--surface2); border-radius: var(--r-m); padding: 2px; }
.seg button { min-width: 56px; min-height: 40px; padding: 0 12px; border-radius: 10px; font-weight: 600; color: var(--text2); transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.seg.sm button { min-width: 44px; min-height: 36px; padding: 0 8px; }
.upd { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; color: var(--text2); font-size: var(--t-xs); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); flex: none; }
.dot.fresh { background: var(--up); }
.search { margin: 0 16px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: var(--surface2); border-radius: var(--r-m); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; min-height: 44px; font-size: var(--t-m); }
.search:focus-within { outline: 2px solid var(--accent); }

/* chips */
.chips { padding-top: 2px; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 14px; border-radius: var(--r-pill); background: var(--surface2); color: var(--text2); font-weight: 600; white-space: nowrap; transition: background var(--dur) var(--ease); }
.chip::before { content: ""; position: absolute; inset: -4px 0; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tag { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface2); color: var(--text); font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.tag.sym { color: var(--accent); }
.badge-l { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; min-height: 20px; padding: 0 6px; border-radius: 6px; border: 1px dashed var(--text3); color: var(--text2); font-size: 12px; font-weight: 500; vertical-align: 2px; white-space: nowrap; }

/* level chip */
.lv { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: var(--surface2); }
.lv i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--l0); background: transparent; }
.lv.l1 { color: var(--l1); } .lv.l2 { color: var(--l2); } .lv.l3 { color: var(--l3); }
.lv.l0 i { border-color: var(--l0); }
.lv.l1 i.f { background: var(--l1); border-color: var(--l1); }
.lv.l2 i.f { background: var(--l2); border-color: var(--l2); }
.lv.l3 i.f { background: var(--l3); border-color: var(--l3); }
.lv.l1 i:not(.f), .lv.l2 i:not(.f), .lv.l3 i:not(.f) { border-color: var(--text3); }
.lv.big { height: 32px; padding: 0 12px; gap: 6px; } .lv.big i { width: 10px; height: 10px; }

/* symbol row */
.sr { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 84px 72px; grid-template-areas: "tk px pc" "sg vl lv"; column-gap: 8px; row-gap: 4px; align-items: center; min-height: 64px; padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--bg); }
.sr > div { min-width: 0; }
.sr .tk { grid-area: tk; font-size: var(--t-m); font-weight: 700; }
.sr .px { grid-area: px; font-size: var(--t-m); font-weight: 600; }
.sr .pc { grid-area: pc; font-size: var(--t-s); font-weight: 600; }
.sr .sg { grid-area: sg; display: flex; gap: 8px; color: var(--text); }
.sr .vl { grid-area: vl; font-size: var(--t-xs); color: var(--text2); }
.sr .lvc { grid-area: lv; justify-self: end; }
.sr.cp { grid-template-columns: minmax(0, 1fr) 72px 72px 64px; grid-template-areas: "tk px pc lv"; min-height: 56px; }
.sr.lk { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "tk lv"; min-height: 56px; }
.sg .s-off { opacity: .28; }
.sr::after { content: ""; position: absolute; inset: 0; background: var(--up); opacity: 0; pointer-events: none; }
.sr.flash-up::after { animation: flash 600ms ease-out; background: var(--up); }
.sr.flash-dn::after { animation: flash 600ms ease-out; background: var(--dn); }
@keyframes flash { from { opacity: .22; } to { opacity: 0; } }
@media (hover: hover) { .sr:hover { background: var(--surface); } }

/* swipe */
.sw-wrap { position: relative; overflow: hidden; }
.sw-del { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; display: grid; place-items: center; background: var(--danger); color: #fff; font-weight: 700; }
.sw-del button { width: 100%; height: 100%; color: #fff; display: grid; place-items: center; gap: 2px; align-content: center; }
.sw-front { position: relative; transition: transform var(--dur) var(--ease); touch-action: pan-y; }
.sw-front.drag { transition: none; }

/* empty / states */
.empty { display: grid; justify-items: center; gap: 8px; padding: 64px 16px; color: var(--text2); }
.lockbox { display: grid; justify-items: center; gap: 12px; padding: 32px 16px 24px; text-align: center; }
.lockbox .ring { width: 64px; height: 64px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; color: var(--text2); }
.lockbox .tt { font-size: var(--t-m); font-weight: 700; }
.btn { min-height: 48px; padding: 0 24px; border-radius: var(--r-m); background: var(--accent); color: var(--on-accent) !important; font-weight: 700; font-size: var(--t-m); transition: opacity var(--dur); }
.btn:disabled { opacity: .5; }
.btn.ghost { background: var(--surface2); color: var(--text) !important; }
.btn.danger { background: var(--danger); color: #fff !important; }
.errrow { display: flex; align-items: center; gap: 12px; margin: 16px; padding: 8px 8px 8px 16px; min-height: 56px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--danger); }
.errrow .od-fill { font-weight: 600; }
.sk { background: var(--surface2); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.skr { display: grid; grid-template-columns: 1fr 84px 72px; gap: 8px; align-items: center; min-height: 64px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.skr > div { display: grid; gap: 8px; justify-items: end; } .skr > div:first-child { justify-items: start; }
.ptr { position: relative; }
.ptr-ind { height: 0; overflow: hidden; display: grid; place-items: center; color: var(--text2); transition: height var(--dur) var(--ease); }
.ptr-ind.pull { transition: none; }
.ptr-ind svg.spin { animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* tab bar */
.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); }
.tabbar button { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 56px; color: var(--text2); font-size: var(--t-xs); font-weight: 500; }
.tabbar button[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.tabbar button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* detail */
.dh { display: flex; align-items: center; gap: 4px; padding: 4px 8px; min-height: 52px; }
.dh .ti { flex: 1; min-width: 0; display: grid; }
.dh .ti b { font-size: var(--t-l); }
.dh .ti span { font-size: var(--t-xs); color: var(--text2); }
.d-sec { padding: 12px 16px 4px; }
.d-title { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: var(--t-xs); font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
.big-px { font-size: var(--t-xl); font-weight: 700; line-height: 1.1; }
.pbar { position: relative; height: 8px; border-radius: 4px; background: var(--surface2); margin: 12px 0 8px; }
.pbar i { position: absolute; top: -4px; width: 3px; height: 16px; border-radius: 2px; transform: translateX(-50%); }
.pbar .m { background: var(--text); width: 4px; top: -6px; height: 20px; border-radius: 3px; box-shadow: 0 0 0 2px var(--bg); }
.pcols { display: grid; grid-template-columns: repeat(3, 1fr); }
.pcols > div:nth-child(1) { text-align: left; } .pcols > div:nth-child(2) { text-align: center; } .pcols > div:nth-child(3) { text-align: right; }
.cap { font-size: var(--t-xs); color: var(--text2); }
.val { font-size: var(--t-m); font-weight: 600; white-space: nowrap; }
.tile { background: var(--surface); border-radius: var(--r-m); padding: 12px; }
.sigchip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: var(--r-pill); background: var(--surface2); font-weight: 600; white-space: nowrap; }
.sigchip em { font-style: normal; color: var(--text3); font-size: var(--t-xs); }
.zrow { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.zrow:last-child { border-bottom: 0; }
.band { position: relative; height: 12px; border-radius: 6px; background: var(--surface2); }
.band .bd { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

.dg-h { display: flex; align-items: center; gap: 8px; font-weight: 700; min-height: 28px; }
.dg-h .od-fill { font-size: var(--t-m); }

.dg-l { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 28px; }

.zr { display: grid; grid-template-columns: 64px minmax(0, 1fr) 76px; grid-template-areas: "tk bd kd" "px bd ds"; column-gap: 12px; row-gap: 0; align-items: center; min-height: 64px; padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }

.zr .tk { grid-area: tk; font-weight: 700; font-size: var(--t-m); } .zr .px { grid-area: px; font-size: var(--t-xs); }
.zr .bdw { grid-area: bd; padding: 0 4px; } .zr .kd { grid-area: kd; font-weight: 600; text-align: right; } .zr .ds { grid-area: ds; font-size: var(--t-xs); text-align: right; color: var(--text2); display: flex; justify-content: flex-end; align-items: center; gap: 2px; }

/* settings */
.sec { padding: 16px 16px 4px; color: var(--text2); font-size: var(--t-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

.set.danger { color: var(--danger); font-weight: 600; }
.swt { position: relative; width: 52px; min-height: 44px; display: grid; place-items: center; }

.swt i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text2); transition: transform var(--dur) var(--ease), background var(--dur); }

.tin { min-height: 44px; min-width: 88px; padding: 0 8px; border-radius: var(--r-s); background: var(--surface2); border: 1px solid var(--line); color: var(--text); font-size: var(--t-m); font-variant-numeric: tabular-nums; }
.disc { padding: 24px 16px; color: var(--text3); font-size: var(--t-xs); text-align: center; }

/* login */

/* overlay */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(0, 0, 0, .55); animation: fade var(--dur) ease-out; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; display: grid; gap: 12px; max-height: 78%; padding: 16px 16px calc(var(--phone-safe-bottom, 29px) + 12px); background: var(--surface); border-radius: 20px 20px 0 0; animation: up 260ms var(--ease); grid-template-rows: auto auto minmax(0, 1fr); }
.sheet.dlg { top: auto; bottom: 50%; transform: translateY(50%); left: 24px; right: 24px; border-radius: var(--r-m); padding: 16px; grid-template-rows: none; animation: fade var(--dur) ease-out; }
.sheet h2 { margin: 0; font-size: var(--t-l); }
.sh-h { display: flex; align-items: center; justify-content: space-between; }
.sh-list { overflow-y: auto; min-height: 0; margin: 0 -16px; }
.sh-r { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px 0 16px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.sh-r .od-fill { display: grid; } .sh-r small { color: var(--text2); font-size: var(--t-xs); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.toast { position: absolute; z-index: 50; left: 50%; bottom: calc(var(--phone-safe-bottom, 29px) + 72px); transform: translateX(-50%); padding: 10px 16px; border-radius: var(--r-pill); background: var(--text); color: var(--bg); font-weight: 600; white-space: nowrap; animation: fade var(--dur) ease-out; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {

}

/* ===== Design sheet (outside the handset) ===== */

.ds .sp { display: flex; align-items: flex-end; gap: 16px; }
.ds .sp div { display: grid; justify-items: center; gap: 4px; font-size: var(--t-xs); color: var(--text2); }

.ds .states { display: flex; flex-wrap: wrap; gap: 8px; }

.ds .tb-demo { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-radius: var(--r-m); overflow: hidden; }

.i-btn.rel { position: relative; }

.tl-r.l1 .ln i { border-color: var(--l1); } .tl-r.l2 .ln i { border-color: var(--l2); } .tl-r.l3 .ln i { border-color: var(--l3); }

.prog { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.ib { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 8px 16px; border-bottom: 1px solid var(--line); text-align: left; }
.ib .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; }

.tag.tb { position: relative; cursor: pointer; font-size: var(--t-s); vertical-align: middle; }
.tag.tb::before { content: ""; position: absolute; inset: -10px -4px; }
.band.big { height: 20px; border-radius: 10px; } .band.big .bd { border-radius: 10px; } .band.big .mk { height: 28px; top: -4px; }
.rd { display: flex; align-items: center; border-bottom: 1px solid var(--line); background: var(--bg); }
.rd .sr { border-bottom: 0; flex: 1; min-width: 0; }
.hd { width: 44px; height: 56px; display: grid; place-items: center; color: var(--text2); touch-action: none; cursor: grab; }
.rd.dragging { position: relative; z-index: 2; background: var(--surface); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
.sheet.fil { grid-template-rows: auto minmax(0, 1fr) auto; }
.sheet.fit { grid-template-rows: none; }
.sug { text-align: left; border: 1px solid var(--line) !important; display: grid; gap: 4px; min-height: 64px; }
.sug[aria-pressed="true"] { border-color: var(--accent) !important; background: var(--accent-soft); }
.fapp .tabbar { grid-row: 3; }
.stage-link { position: fixed; top: 16px; right: 16px; z-index: 60; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 600 14px var(--font); cursor: pointer; }

.ds .ds-top { display: flex; gap: 8px; margin-bottom: 16px; }
.ds .ds-top button, .ds .states button { min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font: 600 14px var(--font); cursor: pointer; }

/* chart */
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function series(s, range) {
  const n = { '1T': 48, '1M': 30, '3M': 60 }[range]; let seed = hash(s.t + range);
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const start = range === '1T' ? s.ref : s.p * (range === '1M' ? .97 + rnd() * .06 : .92 + rnd() * .16);
  const a = [start]; let v = start;
  for (let i = 1; i < n; i++) { v += (rnd() - .5) * s.p * (range === '1T' ? .005 : .014); a.push(v); }
  const end = a[n - 1]; return a.map((x, i) => x + (s.p - end) * i / (n - 1));
}
function chart(s) {
  const a = series(s, S.range), W = 342, H = 132, P = 10;
  const all = S.range === '1T' ? [...a, s.ref] : a, mn = Math.min(...all), mx = Math.max(...all), sp = (mx - mn) || 1;
  const X = i => (i / (a.length - 1) * W).toFixed(1), Y = v => (H - P - (v - mn) / sp * (H - 2 * P)).toFixed(1);
  const d = a.map((v, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(v)).join('');
  const col = a[a.length - 1] >= a[0] ? 'var(--up)' : 'var(--dn)';
  const lab = { '1T': ['09:00', '14:45'], '1M': ['04/10', '04/11'], '3M': ['04/08', '04/11'] }[S.range];
  return `<svg viewBox="0 0 ${W} ${H + 16}" width="100%" height="${H + 16}" role="img" aria-label="Biểu đồ ${s.t} ${S.range}" style="display:block">
    ${[0, .5, 1].map(f => `<line x1="0" x2="${W}" y1="${(P + f * (H - 2 * P)).toFixed(1)}" y2="${(P + f * (H - 2 * P)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${S.range === '1T' ? `<line x1="0" x2="${W}" y1="${Y(s.ref)}" y2="${Y(s.ref)}" stroke="var(--rf)" stroke-width="1" stroke-dasharray="4 4"/>` : ''}
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${W}" cy="${Y(s.p)}" r="3.5" fill="${col}"/>
    <text x="2" y="${P + 10}" fill="var(--text2)" font-size="11">${nf(mx)}</text><text x="2" y="${H - P - 3}" fill="var(--text2)" font-size="11">${nf(mn)}</text>
    <text x="0" y="${H + 12}" fill="var(--text2)" font-size="11">${lab[0]}</text><text x="${W}" y="${H + 12}" text-anchor="end" fill="var(--text2)" font-size="11">${lab[1]}</text></svg>`;
}
function detailNews(s) {
  const own = NEWS.filter(n => n.m === s.m && n.t === s.t), rest = NEWS.filter(n => n.m === s.m && n.t === '');
  return [...own, ...rest].slice(0, 3);
}

    <div class="d-sec"><div class="od-grid" style="--od-cols:2;--od-gap:8px">${tiles}</div></div>

/* pull to refresh (mouse + touch) */
function doRefresh() {
  if (S.loading) return; const p = $('#ptr'); if (p) { p.style.height = '40px'; p.innerHTML = icon('refresh', 20, 'spin'); }
  S.loading = true; setList();
  setTimeout(() => { jitter(6); S.loading = false; S.updated = new Date(); if (curView() === 'board') render('board'); }, 800);

function bindPull() {
  const sc = $('#board-scroll'), ind = $('#ptr'); if (!sc) return;
  let y0 = null, dy = 0;
  const start = y => { if (sc.scrollTop <= 0 && !S.loading) { y0 = y; dy = 0; } };
  const move = (y, ev) => { if (y0 === null) return; dy = Math.max(0, Math.min(90, (y - y0) * .5)); if (dy > 0) { ind.classList.add('pull'); ind.style.height = dy + 'px'; ev.cancelable && ev.preventDefault(); } };
  const end = () => { if (y0 === null) return; ind.classList.remove('pull'); const go = dy >= 40; y0 = null; if (go) doRefresh(); else ind.style.height = '0'; };
  sc.addEventListener('touchstart', e => start(e.touches[0].clientY), { passive: true });
  sc.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });

  } catch (e) { const pre = document.createElement('pre'); pre.id = '__err'; pre.textContent = String(e && e.stack || e); document.body.appendChild(pre); }
