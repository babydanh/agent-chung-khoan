name: agent_ck
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  http: ^1.6.0
  path_drawing: ^1.0.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  workmanager: ^0.10.10
  xml: ^7.1.0

# shared_preferences_android 2.5 pulls in a native (jni/CMake) build that needs the 2 GB Android NDK; 2.4 does not.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
